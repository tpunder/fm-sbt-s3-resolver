name: Build and Tests

on:
  push:
  pull_request:

jobs:
  # This builds and runs local tests
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #os: [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ]
        os: [ 'ubuntu-latest' ]
        java: [ '8', '11', '17' ]
    name: Build/Test - Java ${{ matrix.Java }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v2
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      # The sbt 2.x / Scala 3 cross build needs Java 17+ (compiler bridge is class version 61)
      - name: Test (sbt 1.x only)
        if: ${{ matrix.java != '17' }}
        run: sbt test
      - name: Test (all cross builds)
        if: ${{ matrix.java == '17' }}
        run: sbt +test

  # This runs the SBT "scripted" tests
  scripted:
    needs: build # Don't bother running the scripted tests if the main build/test fails.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #os: [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ]
        os: [ 'ubuntu-latest' ]
        java: [ '8', '11', '17' ]
        sbt:
          - 1.13.1
          - 2.0.12
        include:
          - sbt: 1.13.1
            scala: 2.12.20
          - sbt: 2.0.12
            scala: 3.8.4
        exclude:
          - sbt: 2.0.12
            java: 8
          - sbt: 2.0.12
            java: 11
    name: Scripted - SBT ${{ matrix.sbt }}, Java ${{ matrix.Java }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v2
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Start LocalStack
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=s3 localstack/localstack:0.13.3
          echo "Waiting for LocalStack startup..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/health | grep -q '"s3": "running"' && break
            sleep 2
          done
          echo "LocalStack Startup complete"
          curl -sf -X PUT http://localhost:4566/fm-sbt-s3-resolver-example-bucket

      - run: sbt -v ++${{ matrix.scala }} publishLocal 'set scriptedSbt := "${{ matrix.sbt }}"' scripted
        env:
          # LocalStack Notes:
          #  - Seems to want Path Style Access (which is deprecated in AWS S3)
          #  - Seems to want the service endpoint to contain the bucket name (even with path style access)
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_KEY: test
          S3_PATH_STYLE_ACCESS: true
          S3_SERVICE_ENDPOINT: http://fm-sbt-s3-resolver-example-bucket.s3.us-west-2.localhost.localstack.cloud:4566
          S3_SIGNING_REGION: us-west-2
