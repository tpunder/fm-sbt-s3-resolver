name: Build and Tests

on:
  push:
  pull_request:

jobs:
  # This builds and runs local tests
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #os: [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ]
        os: [ 'ubuntu-latest' ]
        java: [ '8', '11', '17' ]
    name: Build/Test - Java ${{ matrix.Java }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v2
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      # The sbt 2.x / Scala 3 cross build needs Java 17+ (compiler bridge is class version 61)
      - name: Test (sbt 1.x only)
        if: ${{ matrix.java != '17' }}
        run: sbt test
      - name: Test (all cross builds)
        if: ${{ matrix.java == '17' }}
        run: sbt +test

  # This runs the SBT "scripted" tests
  scripted:
    needs: build # Don't bother running the scripted tests if the main build/test fails.
    runs-on: ${{ matrix.os }}
    environment: fm-sbt-s3-resolver-example-bucket # This is the GitHub environment that holds the AWS secrets referenced below
    strategy:
      fail-fast: false
      matrix:
        #os: [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ]
        os: [ 'ubuntu-latest' ]
        java: [ '8', '11', '17' ]
        sbt:
          - 1.13.1
          - 2.0.12
        include:
          # sbt 1.x plugins are built with Scala 2.12 and sbt 2.x plugins with Scala 3
          - sbt: 1.13.1
            scala: 2.12.20
          - sbt: 2.0.12
            scala: 3.8.4
        exclude:
          # sbt 2.x requires Java 17+
          - sbt: 2.0.12
            java: 8
          - sbt: 2.0.12
            java: 11
    name: Scripted - SBT ${{ matrix.sbt }}, Java ${{ matrix.Java }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v2
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      
      #
      # Test using S3 if we can access the secrets
      #

      # This will publishLocal the plugin for the matrix.scala version (sbt 1.x or 2.x) then test
      # example apps using the matrix.sbt version. We set scriptedSbt rather than using ^^ because
      # ^^ creates a cyclic reference with our pluginCrossBuild / sbtVersion override.
      - run: sbt -v ++${{ matrix.scala }} publishLocal 'set scriptedSbt := "${{ matrix.sbt }}"' scripted
        if: ${{ github.event_name == 'push' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      
      #
      # Test using LocalStack if no access to secrets
      #
      
      - name: Start LocalStack
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          # install LocalStack cli and awslocal
          pip install localstack awscli-local[ver1]
          # Make sure to pull the latest version of the image
          docker pull localstack/localstack
          # Start LocalStack in the background
          SERVICES=s3 localstack start -d
          # Wait 30 seconds for the LocalStack container to become ready before timing out
          echo "Waiting for LocalStack startup..."
          localstack wait -t 30
          echo "LocalStack Startup complete"
          awslocal s3api create-bucket --bucket fm-sbt-s3-resolver-example-bucket
      # This will publishLocal the plugin for the matrix.scala version (sbt 1.x or 2.x) then test
      # example apps using the matrix.sbt version. We set scriptedSbt rather than using ^^ because
      # ^^ creates a cyclic reference with our pluginCrossBuild / sbtVersion override.
      - run: sbt -v ++${{ matrix.scala }} publishLocal 'set scriptedSbt := "${{ matrix.sbt }}"' scripted
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # LocalStack Notes:
          #  - Seems to want Path Style Access (which is deprecated in AWS S3)
          #  - Seems to want the service endpoint to contain the bucket name (even with path style access)
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_KEY: test
          S3_PATH_STYLE_ACCESS: true
          S3_SERVICE_ENDPOINT: http://fm-sbt-s3-resolver-example-bucket.s3.us-west-2.localhost.localstack.cloud:4566
          S3_SIGNING_REGION: us-west-2
